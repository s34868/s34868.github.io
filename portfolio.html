<meta charset="UTF-8">

<style>

    /* ========================================
       RESET
    ======================================== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    /* ========================================
       BODY
    ======================================== */

    body {

        font-family: "Kanit", sans-serif;

        min-height: 100vh;

        color: white;

        overflow-x: hidden;

        background:

            radial-gradient(
                circle at 15% 15%,
                rgba(255, 202, 40, 0.16),
                transparent 28%
            ),

            radial-gradient(
                circle at 85% 80%,
                rgba(30, 100, 255, 0.20),
                transparent 35%
            ),

            linear-gradient(
                135deg,
                #020d25 0%,
                #06245c 45%,
                #02102f 100%
            );

    }


    /* ========================================
       BACKGROUND LIGHT
    ======================================== */

    .light {

        position: fixed;

        width: 600px;
        height: 600px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(255, 210, 70, 0.12),
                transparent 70%
            );

        top: -300px;
        right: -200px;

        pointer-events: none;

        animation:
            floating 8s ease-in-out infinite;

    }


    .light-two {

        position: fixed;

        width: 500px;
        height: 500px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(35, 120, 255, 0.13),
                transparent 70%
            );

        bottom: -250px;
        left: -200px;

        pointer-events: none;

        animation:
            floating 10s ease-in-out infinite reverse;

    }


    /* ========================================
       GOLD PARTICLES
    ======================================== */

    .particle {

        position: fixed;

        width: 5px;
        height: 5px;

        background: #f8d66d;

        border-radius: 50%;

        box-shadow:
            0 0 15px #f8d66d;

        opacity: 0.5;

        animation:
            floatParticle 6s ease-in-out infinite;

    }


    .p1 {
        top: 15%;
        left: 10%;
    }

    .p2 {
        top: 30%;
        right: 12%;
        animation-delay: 2s;
    }

    .p3 {
        bottom: 20%;
        left: 15%;
        animation-delay: 4s;
    }

    .p4 {
        bottom: 30%;
        right: 20%;
        animation-delay: 1s;
    }


    /* ========================================
       MAIN CONTAINER
    ======================================== */

    .page {

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        padding:
            60px 25px;

    }


    .container {

        width: 100%;

        max-width: 1200px;

        text-align: center;

        animation:
            fadeUp 1.2s ease;

    }


    /* ========================================
       HEADER
    ======================================== */

    .gold-line {

        width: 100px;

        height: 5px;

        margin:
            0 auto 25px;

        border-radius: 20px;

        background:

            linear-gradient(
                90deg,
                #a97908,
                #fff0a6,
                #d3a52a,
                #fff0a6,
                #a97908
            );

        box-shadow:
            0 0 20px
            rgba(255, 205, 60, 0.5);

    }


    .welcome {

        font-size: 17px;

        letter-spacing: 4px;

        color: #e8c85b;

        margin-bottom: 10px;

        font-weight: 400;

    }


    h1 {

        font-size:
            clamp(42px, 7vw, 75px);

        font-weight: 600;

        line-height: 1.15;

        margin-bottom: 12px;

        color: #ffffff;

        text-shadow:

            0 5px 30px
            rgba(0,0,0,0.4);

    }


    .subtitle {

        font-size:
            clamp(18px, 3vw, 25px);

        font-weight: 300;

        color:
            rgba(255,255,255,0.75);

        margin-bottom: 55px;

    }


    .subtitle span {

        color: #f7d56b;

        font-weight: 500;

    }


    /* ========================================
       MENU GRID
    ======================================== */

    .menu {

        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 28px;

    }


    /* ========================================
       CARD
    ======================================== */

    .card {

        position: relative;

        min-height: 300px;

        padding: 45px 30px;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        text-decoration: none;

        color: white;

        border-radius: 28px;

        background:

            linear-gradient(
                145deg,
                rgba(255,255,255,0.12),
                rgba(255,255,255,0.035)
            );

        border:
            1px solid
            rgba(255,215,80,0.20);

        backdrop-filter:
            blur(15px);

        box-shadow:

            0 20px 50px
            rgba(0,0,0,0.30),

            inset 0 0 30px
            rgba(255,255,255,0.02);

        overflow: hidden;

        transition:
            0.45s cubic-bezier(
                0.2,
                0.8,
                0.2,
                1
            );

    }


    /* เส้นทองด้านบน */

    .card::before {

        content: "";

        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 5px;

        background:

            linear-gradient(
                90deg,
                #9c720d,
                #ffe58a,
                #c99a20,
                #ffe58a,
                #9c720d
            );

    }


    /* แสงด้านหลัง */

    .card::after {

        content: "";

        position: absolute;

        width: 250px;
        height: 250px;

        border-radius: 50%;

        background:

            radial-gradient(
                circle,
                rgba(255,210,70,0.14),
                transparent 70%
            );

        top: -140px;
        right: -100px;

        transition:
            0.6s ease;

    }


    /* ========================================
       CARD HOVER
    ======================================== */

    .card:hover {

        transform:
            translateY(-15px)
            scale(1.025);

        border-color:
            rgba(255,220,100,0.65);

        box-shadow:

            0 30px 70px
            rgba(0,0,0,0.45),

            0 0 40px
            rgba(255,205,60,0.13);

    }


    .card:hover::after {

        transform:
            scale(2.2);

    }


    /* ========================================
       ICON
    ======================================== */

    .icon {

        width: 100px;
        height: 100px;

        display: flex;

        align-items: center;

        justify-content: center;

        border-radius: 50%;

        margin-bottom: 25px;

        font-size: 48px;

        background:

            linear-gradient(
                145deg,
                rgba(255,216,90,0.20),
                rgba(255,255,255,0.05)
            );

        border:
            1px solid
            rgba(255,215,80,0.35);

        box-shadow:

            0 10px 30px
            rgba(0,0,0,0.25),

            0 0 25px
            rgba(255,210,60,0.08);

        transition:
            0.4s ease;

    }


    .card:hover .icon {

        transform:
            scale(1.12)
            rotate(5deg);

        box-shadow:

            0 10px 35px
            rgba(0,0,0,0.35),

            0 0 35px
            rgba(255,215,70,0.22);

    }


    /* ========================================
       CARD TEXT
    ======================================== */

    .card-title {

        font-size: 25px;

        font-weight: 500;

        color: #ffffff;

        margin-bottom: 8px;

    }


    .card-description {

        font-size: 15px;

        font-weight: 300;

        color:
            rgba(255,255,255,0.60);

    }


    .arrow {

        margin-top: 22px;

        font-size: 25px;

        color: #f4d369;

        transition:
            0.3s ease;

    }


    .card:hover .arrow {

        transform:
            translateX(8px);

    }


    /* ========================================
       BACK BUTTON
    ======================================== */

    .back {

        display: inline-flex;

        align-items: center;

        gap: 8px;

        margin-top: 50px;

        padding:
            11px 28px;

        border-radius: 40px;

        text-decoration: none;

        color:
            rgba(255,255,255,0.75);

        border:
            1px solid
            rgba(255,255,255,0.20);

        background:
            rgba(255,255,255,0.04);

        transition:
            0.3s ease;

    }


    .back:hover {

        color: #ffe082;

        border-color:
            #e8c85b;

        transform:
            translateY(-3px);

        background:
            rgba(255,215,80,0.06);

    }


    /* ========================================
       FOOTER
    ======================================== */

    .footer {

        margin-top: 30px;

        color:
            rgba(255,255,255,0.35);

        font-size: 13px;

    }


    /* ========================================
       ANIMATION
    ======================================== */

    @keyframes fadeUp {

        from {

            opacity: 0;

            transform:
                translateY(40px);

        }

        to {

            opacity: 1;

            transform:
                translateY(0);

        }

    }


    @keyframes floating {

        0%, 100% {

            transform:
                translateY(0);

        }

        50% {

            transform:
                translateY(30px);

        }

    }


    @keyframes floatParticle {

        0%, 100% {

            transform:
                translateY(0);

            opacity: 0.2;

        }

        50% {

            transform:
                translateY(-30px);

            opacity: 0.8;

        }

    }


    /* ========================================
       TABLET
    ======================================== */

    @media (max-width: 900px) {

        .menu {

            grid-template-columns:
                repeat(2, 1fr);

        }

        .card:last-child {

            grid-column:
                1 / -1;

        }

    }


    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 600px) {

        .page {

            padding:
                45px 18px;

        }

        .welcome {

            font-size: 13px;

            letter-spacing: 2px;

        }

        .subtitle {

            margin-bottom: 35px;

        }

        .menu {

            grid-template-columns:
                1fr;

            gap: 18px;

        }

        .card:last-child {

            grid-column:
                auto;

        }

        .card {

            min-height: 240px;

            padding: 35px 20px;

        }

        .icon {

            width: 80px;
            height: 80px;

            font-size: 38px;

        }

        .card-title {

            font-size: 22px;

        }

    }

</style>
```
