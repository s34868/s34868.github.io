<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>แฟ้มสะสมผลงานของฉัน</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>

        /* ==============================
           RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family: 'Kanit', sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(212, 175, 55, 0.12),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #020b1c 0%,
                    #061936 45%,
                    #031025 100%
                );

            overflow-x: hidden;
        }


        /* ==============================
           BACKGROUND DECORATION
        ============================== */

        body::before {
            content: "";
            position: fixed;

            width: 500px;
            height: 500px;

            top: -180px;
            left: -180px;

            background: rgba(212, 175, 55, 0.08);

            border-radius: 50%;

            filter: blur(80px);

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;

            width: 450px;
            height: 450px;

            right: -150px;
            bottom: -150px;

            background: rgba(20, 75, 150, 0.22);

            border-radius: 50%;

            filter: blur(80px);

            pointer-events: none;
        }


        /* ==============================
           MUSIC DECORATION
        ============================== */

        .music-symbol {
            position: fixed;

            color: rgba(212, 175, 55, 0.12);

            font-family: "Times New Roman", serif;

            pointer-events: none;

            z-index: 0;

            user-select: none;
        }

        .symbol-1 {
            top: 18%;
            left: 6%;

            font-size: 90px;

            transform: rotate(-12deg);
        }

        .symbol-2 {
            top: 45%;
            right: 7%;

            font-size: 100px;

            transform: rotate(10deg);
        }

        .symbol-3 {
            bottom: 12%;
            left: 12%;

            font-size: 70px;

            transform: rotate(8deg);
        }


        /* ==============================
           MAIN CONTAINER
        ============================== */

        .container {
            position: relative;

            z-index: 2;

            width: min(1100px, 92%);

            margin: auto;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 70px 20px;
        }


        /* ==============================
           HEADER
        ============================== */

        .header {
            text-align: center;

            margin-bottom: 55px;
        }

        .small-title {
            color: #d4af37;

            font-size: 15px;

            letter-spacing: 5px;

            margin-bottom: 18px;

            text-transform: uppercase;
        }

        .main-title {
            font-family: 'Playfair Display', serif;

            font-size: clamp(38px, 6vw, 72px);

            font-weight: 700;

            line-height: 1.15;

            color: #ffffff;

            text-shadow:
                0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .main-title span {
            color: #d4af37;

            display: block;

            margin-top: 5px;
        }

        .subtitle {
            margin-top: 20px;

            color: rgba(255,255,255,0.68);

            font-size: 17px;

            font-weight: 300;

            letter-spacing: 1px;
        }


        /* ==============================
           GOLD LINE
        ============================== */

        .gold-line {
            width: 150px;
            height: 2px;

            margin: 25px auto 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d4af37,
                    #f5d77a,
                    #d4af37,
                    transparent
                );

            box-shadow:
                0 0 15px rgba(212, 175, 55, 0.45);
        }


        /* ==============================
           MENU
        ============================== */

        .menu {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 25px;

            max-width: 1000px;
        }


        /* ==============================
           BUTTON CARD
        ============================== */

        .menu-card {
            position: relative;

            min-height: 260px;

            padding: 35px 25px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            text-decoration: none;

            color: #ffffff;

            background:
                linear-gradient(
                    145deg,
                    rgba(16, 46, 88, 0.9),
                    rgba(3, 19, 43, 0.92)
                );

            border: 1px solid rgba(212, 175, 55, 0.38);

            border-radius: 18px;

            box-shadow:
                0 20px 45px rgba(0,0,0,0.35),
                inset 0 0 30px rgba(255,255,255,0.015);

            overflow: hidden;

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease,
                border-color 0.35s ease;
        }

        .menu-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d4af37,
                    transparent
                );

            opacity: 0.8;
        }

        .menu-card::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -100px;
            right: -80px;

            border-radius: 50%;

            background: rgba(212, 175, 55, 0.06);

            transition: 0.4s ease;
        }

        .menu-card:hover {
            transform: translateY(-12px);

            border-color: #d4af37;

            box-shadow:
                0 28px 60px rgba(0,0,0,0.5),
                0 0 30px rgba(212,175,55,0.12);
        }

        .menu-card:hover::after {
            transform: scale(1.5);

            background: rgba(212,175,55,0.09);
        }


        /* ==============================
           ICON
        ============================== */

        .icon {
            position: relative;

            z-index: 2;

            width: 82px;
            height: 82px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 23px;

            border-radius: 50%;

            border: 1px solid rgba(212,175,55,0.55);

            background:
                rgba(212,175,55,0.07);

            color: #d4af37;

            font-size: 38px;

            box-shadow:
                0 0 25px rgba(212,175,55,0.08);

            transition: 0.35s ease;
        }

        .menu-card:hover .icon {
            transform: scale(1.08);

            background: rgba(212,175,55,0.12);

            box-shadow:
                0 0 30px rgba(212,175,55,0.2);
        }


        /* ==============================
           CARD TITLE
        ============================== */

        .card-title {
            position: relative;

            z-index: 2;

            font-family: 'Playfair Display', serif;

            font-size: 27px;

            font-weight: 600;

            color: #f5d77a;

            margin-bottom: 10px;
        }

        .card-description {
            position: relative;

            z-index: 2;

            font-size: 14px;

            font-weight: 300;

            line-height: 1.7;

            color: rgba(255,255,255,0.65);

            max-width: 230px;
        }


        /* ==============================
           FOOTER
        ============================== */

        .footer {
            margin-top: 55px;

            text-align: center;

            color: rgba(255,255,255,0.42);

            font-size: 13px;

            letter-spacing: 1px;
        }

        .footer span {
            color: #d4af37;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 850px) {

            .menu {
                grid-template-columns: 1fr;

                max-width: 500px;
            }

            .menu-card {
                min-height: 220px;
            }

            .header {
                margin-bottom: 40px;
            }

        }


        @media (max-width: 500px) {

            .container {
                padding:
                    50px 15px;
            }

            .small-title {
                font-size: 12px;

                letter-spacing: 3px;
            }

            .main-title {
                font-size: 38px;
            }

            .subtitle {
                font-size: 14px;
            }

            .menu-card {
                min-height: 205px;

                padding: 25px 20px;
            }

            .icon {
                width: 68px;
                height: 68px;

                font-size: 30px;
            }

            .card-title {
                font-size: 24px;
            }

        }

    </style>
</head>


<body>

    <!-- Decorative music symbols -->

    <div class="music-symbol symbol-1">♪</div>

    <div class="music-symbol symbol-2">♫</div>

    <div class="music-symbol symbol-3">♬</div>


    <!-- Main -->

    <main class="container">


        <!-- Header -->

        <header class="header">

            <div class="small-title">
                PORTFOLIO
            </div>

            <h1 class="main-title">
                แฟ้มสะสมผลงาน
                <span>ของฉัน</span>
            </h1>

            <div class="gold-line"></div>

            <p class="subtitle">
                แรงบันดาลใจ • ความสามารถ • ประสบการณ์
            </p>

        </header>


        <!-- Menu -->

        <section class="menu">


            <!-- ผลงาน -->

            <a
                href="music.html"
                class="menu-card"
            >

                <div class="icon">
                    ♫
                </div>

                <h2 class="card-title">
                    ผลงาน
                </h2>

                <p class="card-description">
                    รวมผลงานทางด้านดนตรี
                    และผลงานที่ภาคภูมิใจ
                </p>

            </a>


            <!-- คำนำ -->

            <a
                href="volunteer.html"
                class="menu-card"
            >

                <div class="icon">
                    ✦
                </div>

                <h2 class="card-title">
                    คำนำ
                </h2>

                <p class="card-description">
                    เรื่องราว แรงบันดาลใจ
                    และเส้นทางการเรียนรู้
                </p>

            </a>


            <!-- ประวัติส่วนตัว -->

            <a
                href="profile.html"
                class="menu-card"
            >

                <div class="icon">
                    ♩
                </div>

                <h2 class="card-title">
                    ประวัติส่วนตัว
                </h2>

                <p class="card-description">
                    ข้อมูลส่วนตัว
                    ความสนใจ และความสามารถ
                </p>

            </a>


        </section>


        <!-- Footer -->

        <footer class="footer">

            <p>
                My Portfolio
                <span>◆</span>
                Music &amp; Art
            </p>

        </footer>


    </main>

</body>
</html>
